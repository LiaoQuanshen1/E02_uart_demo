project:
  packs:
    - pack: MindMotion::MM32F3270_DFP@^1.0.6
  setups:
    - setup: Options for mm32f327x_g8p_project
      add-path:
        - ../user/inc
        - ../code
        - ../../libraries/zf_common
        - ../../libraries/zf_device
        - ../../libraries/zf_driver
        - ../../libraries/sdk
        - ../../libraries/sdk/CMSIS/Include
        - ../../libraries/sdk/drivers
        - ../../libraries/components/fatfs/source
      debug: "on"
      define:
        - __MICROLIB
      define-asm:
        - __MICROLIB
      misc:
        - C:
            - -std=c99
          C-CPP:
            - -fno-rtti
            - -fsigned-char
            - -fshort-enums
            - -fshort-wchar
            - -ffunction-sections
            - -Wno-packed
            - -Wno-missing-variable-declarations
            - -Wno-missing-prototypes
            - -Wno-missing-noreturn
            - -Wno-sign-conversion
            - -Wno-nonportable-include-path
            - -Wno-reserved-id-macro
            - -Wno-unused-macros
            - -Wno-documentation-unknown-command
            - -Wno-documentation
            - -Wno-license-management
            - -Wno-parentheses-equality
          CPP:
            - -xc++
            - -std=c++11
            - -fno-exceptions
          ASM:
            - -masm=auto
          Link:
            - --library_type=microlib
            - --map
            - --load_addr_map_info
            - --xref
            - --callgraph
            - --symbols
            - --info sizes
            - --info totals
            - --info unused
            - --info veneers
            - --strict
            - --summary_stderr
            - --info summarysizes
  linker:
    - script: ../../libraries/sdk/mdk/linker/mm32f3277g_flash.scf
  groups:
    - group: user_c
      files:
        - file: ../user/src/main.c
        - file: ../user/src/isr.c
    - group: user_h
      files:
        - file: ../user/inc/isr.h
    - group: doc
      files:
        - file: ../../libraries/doc/version.txt
    - group: zf_common
      files:
        - file: ../../libraries/zf_common/zf_common_clock.c
        - file: ../../libraries/zf_common/zf_common_clock.h
        - file: ../../libraries/zf_common/zf_common_debug.c
